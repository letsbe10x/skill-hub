services:
  postgres:
    image: postgres:16-alpine
    container_name: lets-sandbox-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run once on first boot in alphabetical order.
      # Each .sh creates a database + user for an app sandbox that wants
      # to share this instance instead of running its own postgres.
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - lets-sandbox-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:

# Named external network so other sandboxes (jira, confluence, anything else
# that needs postgres) can attach to it by name without depending on this
# stack's auto-generated network name.
networks:
  lets-sandbox-data:
    name: lets-sandbox-data
    driver: bridge
