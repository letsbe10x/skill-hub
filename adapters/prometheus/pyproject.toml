[project]
name = "lets-prometheus"
version = "0.1.0"
description = "Agent-native CLI for Prometheus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-httpserver>=1.0",
]

[project.scripts]
lets-prometheus = "lets_prometheus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lets_prometheus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires a live Prometheus instance at PROMETHEUS_URL (default http://localhost:9090)",
]
