[project]
name = "lets-grafana"
version = "0.1.0"
description = "Agent-native CLI for Grafana."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
lets-grafana = "lets_grafana.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lets_grafana"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires a live Grafana at GRAFANA_URL with valid credentials",
]
