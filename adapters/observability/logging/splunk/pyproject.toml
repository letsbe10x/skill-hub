[project]
name = "lets-splunk"
version = "0.1.0"
description = "Agent-native CLI for Splunk Enterprise (mgmt REST API + HEC)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
lets-splunk = "lets_splunk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lets_splunk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires a live Splunk at SPLUNK_MGMT_URL + SPLUNK_HEC_URL with valid credentials",
]
